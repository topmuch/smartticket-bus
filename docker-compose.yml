# ============================================
# SmartTicket Bus - Docker Compose (Production / Coolify)
# ============================================
version: '3.8'

services:
  web:
    build: .
    container_name: smartticket-bus
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/smartticket.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-generate-a-strong-secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-change-me-generate-a-strong-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-generate-another-strong-secret}
      - QR_SIGNING_SECRET=${QR_SIGNING_SECRET:-change-me-generate-a-qr-secret}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-SmartTicket Bus}
      - NODE_ENV=production
      # Optional: override admin credentials
      # - ADMIN_EMAIL=admin@smartticket.bus
      # - ADMIN_PASSWORD=admin123
    volumes:
      - smartticket-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  smartticket-data:
    driver: local
